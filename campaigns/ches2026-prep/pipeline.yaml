# ches2026-prep — Hack@CHES 2026 决赛备战流水线（由 scripts/gen_nodes.py 生成）
# 24 个 IP 节点并行对 → correlator(门) → verify-planner(子流水线) → reviewer(门) → reporter
name: ches2026-prep
control: true
# deadline: 2026-10-01T09:00:00   # 决赛开始时间，按实际填
env:
  OT_TREE: /data_hdd/tzh24/zgc4/ctf/hack_ches2026/opentitan_blind
  VERILATOR: /data_hdd/tzh24/zgc4/projects/tools/logos/logos-workspace/contexts/targets/opentitan-ches2026/runtime-samples/verilator-4.210/v4.210
  HARNESS: /data_hdd/tzh24/zgc4/ctf/hack_ches2026/logos-lite
nodes:
  oracle-scout-aes:
    agent: oracle-scout
    task: '盘点 IP aes 的全部树内预言机（RTL: $OT_TREE/hw/ip/aes/rtl）。按 FORMAT.md 格式产出 /data_hdd/tzh24/zgc4/ctf/hack_ches2026/hctool/campaigns/ches2026-prep/workdir/oracle-inventory/aes.md，每条预言机带 file:line 且可检验。'
    offline: true
    retry: 1
    timeout: 3600
    seed:
      - /data_hdd/tzh24/zgc4/ctf/hack_ches2026/hctool/knowledge/INDEX.md
      - /data_hdd/tzh24/zgc4/ctf/hack_ches2026/hctool/knowledge/tech-stacks/rtl-opentitan/SECURITY_NOTES.md
  hunter-aes:
    agent: hunter
    deps: [oracle-scout-aes]
    task: '对 IP aes 执行 6-lens 盲猎（$OT_TREE/hw/ip/aes/rtl），弹药 /data_hdd/tzh24/zgc4/ctf/hack_ches2026/hctool/campaigns/ches2026-prep/workdir/oracle-inventory/aes.md（不存在则先自做精简盘点）。report-everything，逐条带预言机依据，产出 /data_hdd/tzh24/zgc4/ctf/hack_ches2026/hctool/campaigns/ches2026-prep/workdir/findings/aes/candidates.md。'
    offline: true
    retry: 1
    timeout: 5400
    seed:
